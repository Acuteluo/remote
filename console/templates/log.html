<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b0f14">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>审计日志 · {{host}}</title>
<link rel="icon" href="/static/vendor/favicon.svg">
<link rel="stylesheet" href="/static/app.css">
<style>
  .logbar { display: flex; gap: 6px; overflow-x: auto; padding: 10px 12px;
    background: var(--card); border-bottom: 1px solid var(--line);
    scrollbar-width: none; }
  .logbar::-webkit-scrollbar { display: none; }
  .logcat { flex: none; padding: 6px 12px; border-radius: 999px;
    border: 1px solid var(--line); background: var(--card2); color: var(--dim);
    font-size: 12px; white-space: nowrap; }
  .logcat b { color: var(--fg); font-weight: 600; margin-left: 4px; }
  .logcat.on { background: var(--acc); border-color: var(--acc); color: #04121f; }
  .logcat.on b { color: #04121f; }

  .logday { color: var(--dim); font-size: 11.5px; padding: 12px 2px 6px;
    font-weight: 600; letter-spacing: .5px; }
  .logrow { display: flex; gap: 8px; align-items: baseline; padding: 5px 0;
    border-bottom: 1px solid #1b2531; font-size: 12.5px; }
  .logrow:last-child { border-bottom: 0; }
  .logt { flex: none; color: var(--dim); font-size: 11.5px;
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    font-variant-numeric: tabular-nums; }
  .logc { flex: none; min-width: 54px; text-align: center; padding: 1px 6px;
    border-radius: 4px; background: #1b2531; color: var(--dim); font-size: 11px; }
  .logm { flex: 1; min-width: 0; color: var(--fg); word-break: break-word; }
  /* 失败/异常的行整条标红, 一眼能挑出来 */
  .logrow.bad .logm { color: var(--bad); }
  .logrow.bad .logc { background: rgba(255,107,107,.16); color: var(--bad); }
  .logtip { color: var(--dim); font-size: 11.5px; line-height: 1.8; padding: 14px 2px 30px; }
</style>
</head>
<body>
<div class="topbar">
  <a class="back" href="/home" title="返回" aria-label="返回">‹</a>
  <span class="logo">审计日志</span>
  <span class="host" id="log-status">加载中…</span>
  <button id="log-refresh">刷新</button>
</div>
<div class="logbar" id="log-cats"></div>
<div class="wrap">
  <div id="log-list"></div>
  <div class="logtip">
    记录登录、输入投递、摄像头/麦克风开关、电源操作等。红色行 = 失败或异常。<br>
    文件位置：console/audit.log（只追加，不会自动清理）
  </div>
</div>
<script src="/static/log.js"></script>
</body>
</html>
