<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b0f14">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>采集模块 · {{host}}</title>
<link rel="icon" href="/static/vendor/favicon.svg">
<link rel="stylesheet" href="/static/app.css">
<style>
  .cam-wrap{max-width:min(100%,980px);margin:10px auto;padding:0 10px}
  .cam-stage{position:relative;background:#000;border-radius:10px;overflow:hidden;
             display:flex;align-items:center;justify-content:center;min-height:220px;
             /* 接管手势: 双指缩放/拖动都由我们处理, 别让浏览器去缩放整个页面 */
             touch-action:none;-webkit-user-select:none;user-select:none}
  .cam-stage img{display:block;width:100%;height:auto;max-height:70vh;object-fit:contain;
                 transform-origin:center center;will-change:transform}
  /* 信息放在**画面外面**, 不挡图; 全屏没有"外面", 才退化成底部一条半透明 */
  .cam-osd{margin-top:8px;background:#111820;border:1px solid #1e2a36;border-radius:8px;
    color:#cfe3f5;font:12.5px/1.75 ui-monospace,SFMono-Regular,Menlo,monospace;
    padding:8px 11px;white-space:pre-wrap;letter-spacing:.2px;transition:opacity .28s ease}
  .cam-osd b{color:#7fd1ff;font-weight:600}

  /* 全屏: 优先 Fullscreen API; 不支持的(iPhone Safari)退化为 fixed 铺满的伪全屏。
     全屏目标是 .cam-wrap(含 stage + 信息条), 这样信息条在全屏时仍可见。 */
  /* 全屏里的覆盖层(顶部按钮 / "横过来看"提示 / 底部信息条) 3.5 秒没操作自动淡出,
     点一下屏幕就回来 —— 和远程桌面全屏同一套逻辑。
     用 **opacity 淡出而不是 display:none**: 一来有淡入淡出, 二来不触发重排
     (display 会让 stage 变大 → 画面重新缩放, 看着会跳)。
     **绝对不要用 filter/backdrop-filter**(画面上方的毛玻璃每帧都要重算, 手机必卡)。 */
  .cam-fs-top{display:none;position:absolute;left:10px;top:10px;z-index:3;gap:8px;
    align-items:center;transition:opacity .28s ease}
  .cam-fs-top button{background:rgba(0,0,0,.55);color:#dfe9f3;
    border:1px solid rgba(255,255,255,.25);border-radius:18px;padding:7px 13px;font-size:13px}
  /* 全屏里的退出键不要框(和远程桌面的 ‹ 一致), 靠 text-shadow 保证看得清 */
  .cam-fs-top #cam-fs-exit{background:transparent;border:0;font-size:22px;
    padding:2px 12px 4px;text-shadow:0 1px 4px #000, 0 0 12px rgba(0,0,0,.75)}
  /* 全屏里的麦克风开关: 和面板里同一个开关, 只是套在深色胶囊里好压在画面上 */
  .cam-fs-mic{display:flex;align-items:center;gap:7px;background:rgba(0,0,0,.55);
    color:#dfe9f3;border:1px solid rgba(255,255,255,.25);border-radius:18px;
    padding:6px 12px;font-size:13px;white-space:nowrap}
  .cam-fs-mic input{width:18px;height:18px;accent-color:var(--acc);margin:0}
  body.cam-fs .cam-fs-top,.cam-wrap:fullscreen .cam-fs-top{display:flex}
  body.cam-fs .cam-wrap.hideui .cam-fs-top,
  body.cam-fs .cam-wrap.hideui .cam-rotate,
  body.cam-fs .cam-wrap.hideui .cam-osd,
  .cam-wrap:fullscreen.hideui .cam-fs-top,
  .cam-wrap:fullscreen.hideui .cam-rotate,
  .cam-wrap:fullscreen.hideui .cam-osd{opacity:0;pointer-events:none}

  body.cam-fs{overflow:hidden;background:#000}
  body.cam-fs .cam-wrap,.cam-wrap:fullscreen{position:fixed;inset:0;z-index:9999;
    margin:0;padding:0;max-width:none;background:#000;
    display:flex;flex-direction:column}
  body.cam-fs .cam-stage,.cam-wrap:fullscreen .cam-stage{flex:1;min-height:0;border-radius:0}
  body.cam-fs .cam-stage img,.cam-wrap:fullscreen .cam-stage img{
    width:100%;height:100%;max-height:none;object-fit:contain}
  body.cam-fs .cam-panel,body.cam-fs .cam-note,
  .cam-wrap:fullscreen .cam-panel,.cam-wrap:fullscreen .cam-note{display:none}
  body.cam-fs .cam-osd,.cam-wrap:fullscreen .cam-osd{margin:0;border:0;border-radius:0;
    background:rgba(0,0,0,.55);text-align:center;font-size:11.5px;padding:6px 10px}

  .cam-rotate{display:none;position:absolute;left:50%;top:12px;transform:translateX(-50%);
    z-index:3;background:rgba(0,0,0,.55);color:#cfe3f5;border-radius:16px;
    padding:5px 12px;font-size:12px;white-space:nowrap;transition:opacity .28s ease}
  body.cam-fs .cam-wrap.portrait .cam-rotate,
  .cam-wrap:fullscreen.portrait .cam-rotate{display:block}
  .cam-hint{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
            color:#8b98a5;font-size:14px;text-align:center;padding:20px;line-height:1.7}

  /* ---- 控制面板 ----
     开关用和设置面板同一种(原生 checkbox + accent-color), 但大一号好点。
     一行一个 .cam-row, 排布清楚, 手机上也不会挤。 */
  .cam-panel{margin-top:10px}
  .cam-swbar{display:flex;gap:8px}
  .cam-sw{flex:1 1 0;min-width:0;display:flex;align-items:center;justify-content:space-between;
    gap:8px;background:var(--card2);border:1px solid var(--line);border-radius:9px;
    padding:10px 12px;font-size:13.5px;color:var(--fg);cursor:pointer}
  .cam-sw span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .cam-sw input[type="checkbox"]{width:20px;height:20px;accent-color:var(--acc);
    margin:0;flex:0 0 auto}
  .cam-sw.on{border-color:var(--acc);background:#12202e}
  .cam-sw input:disabled{opacity:.4}

  .cam-row{display:flex;align-items:center;gap:8px;margin-top:8px;font-size:13px;
    flex-wrap:wrap;color:var(--fg)}
  .cam-row .cam-cap{color:var(--dim);white-space:nowrap}
  .cam-row .sp{flex:1}
  /* 麦克风实时电平: 一眼看出"到底有没有采到声音"; 右边实时报 dB */
  .cam-level{position:relative;flex:1 1 70px;min-width:70px;height:9px;background:#1b2531;
    border-radius:5px;overflow:hidden}
  .cam-level i{display:block;height:100%;width:0;background:#4ade80;
    transition:width .1s linear}
  /* 峰值保持标记: 一根细线, 记着刚才最大到过多少 */
  .cam-level b{position:absolute;top:0;bottom:0;width:2px;margin-left:-1px;left:0;
    background:#eaf6ff;opacity:0;transition:left .1s linear, opacity .2s}
  .cam-level.live b{opacity:.85}
  .cam-level.warm i{background:var(--warn)}
  .cam-level.hot i{background:var(--bad)}
  .cam-level.dead i{background:#64748b}
  .cam-db{font:12px/1 ui-monospace,SFMono-Regular,Menlo,monospace;color:#9fb3c8;
    min-width:64px;text-align:right;font-variant-numeric:tabular-nums}
  /* "画面/声音是多少秒以前的" —— 实时读数 */
  .cam-lag{color:var(--dim);font-size:12.5px;gap:16px}
  .cam-lag b{color:#7fd1ff;font-weight:600;font-variant-numeric:tabular-nums}
  /* 红黄绿: 门槛在 cam.js 里(帧率按目标打折, 画面/声音延时各一套) */
  .cam-lag b.ok,.cam-osd b.ok{color:var(--ok)}
  .cam-lag b.warn,.cam-osd b.warn{color:var(--warn)}
  .cam-lag b.bad,.cam-osd b.bad{color:var(--bad)}
  .mic-info{font-size:12px;color:var(--dim);overflow:hidden;text-overflow:ellipsis;
    white-space:nowrap;max-width:100%}
  .mic-info.ok{color:#7ee2b8}
  .mic-info.bad{color:#ff8a8a}
  .cam-row select,.cam-row button{background:#151c24;color:#d7e0ea;border:1px solid #253141;
    border-radius:8px;padding:7px 11px;font-size:13px}
  .cam-row button:disabled,.cam-row select:disabled{opacity:.4}
  .cam-row button:active{background:#1e2833}
  .cam-vol{display:flex;align-items:center;gap:6px;color:var(--dim);font-size:12px}
  .cam-vol input{width:96px;accent-color:var(--acc)}
  .cam-vol input:disabled{opacity:.4}
  .rec-dot{color:#ff6b6b;font-size:12px;white-space:nowrap;animation:cam-blink 1.5s infinite}
  @keyframes cam-blink{50%{opacity:.3}}
  .cam-note{margin-top:10px;font-size:12.5px;color:#7d8894;line-height:1.75}
  .cam-err{color:#ff8a8a}
</style>
</head>
<body>
<div class="topbar">
  <a class="back" href="/home" title="返回" aria-label="返回">‹</a>
  <span class="logo">采集模块</span>
  <span class="host" id="cam-status">未开启</span>
  <button id="cam-reconnect">重连</button>
</div>

<div class="cam-wrap" id="cam-wrap">
  <div class="cam-stage">
    <img id="cam-img" alt="摄像头画面">
    <div class="cam-fs-top">
      <button id="cam-fs-exit" title="退出全屏" aria-label="退出全屏">✕</button>
      <button id="cam-fs-snap" title="截图">⤓ 截图</button>
      <label class="cam-fs-mic" title="麦克风开关">
        <input type="checkbox" id="cam-fs-mic"><span>麦克风</span></label>
    </div>
    <div class="cam-rotate" id="cam-rotate">横过来看更清楚</div>
    <div class="cam-hint" id="cam-hint">画面已关闭<br>打开下面的「摄像头画面」开关开始采集</div>
  </div>

  <div class="cam-osd" id="cam-osd">画面已关闭</div>

  <div class="cam-panel">
    <div class="cam-swbar">
      <label class="cam-sw" id="cam-video-box">
        <span>摄像头画面</span><input type="checkbox" id="cam-video-sw"></label>
      <label class="cam-sw" id="cam-mic-box">
        <span>麦克风</span><input type="checkbox" id="cam-mic-sw"></label>
    </div>

    <div class="cam-row">
      <span class="cam-cap">收音电平</span>
      <div class="cam-level" id="cam-level" title="麦克风实时电平"><i id="cam-level-bar"></i><b id="cam-level-peak"></b></div>
      <span class="cam-db" id="cam-level-db">--</span>
    </div>

    <div class="cam-row cam-lag">
      <span>帧率 <b id="cam-lag-fps">--</b></span>
      <span>画面 <b id="cam-lag-v">--</b></span>
      <span>声音 <b id="cam-lag-a">--</b></span>
      <span id="cam-audio-state" class="rec-dot" hidden>● 收音中</span>
    </div>

    <div class="cam-row"><span id="cam-mic-info" class="mic-info">麦克风未检测</span></div>

    <div class="cam-row">
      <button id="cam-switch" title="切换摄像头" style="{{sw_hidden}}">切换</button>
      <select id="cam-size" title="分辨率">
        <option value="320x240">320×240 省流量</option>
        <option value="640x480" selected>640×480 标准</option>
        <option value="1280x720">1280×720 高清</option>
      </select>
      <select id="cam-fps" title="帧率">
        <option value="5">5 fps</option>
        <option value="12" selected>12 fps</option>
        <option value="20">20 fps</option>
        <option value="30">30 fps</option>
      </select>
    </div>

    <div class="cam-row">
      <button id="cam-fs">全屏</button>
      <button id="cam-snap">截图</button>
      <span class="sp"></span>
      <label class="cam-vol" title="手机这一端的播放音量">
        <span>音量</span><input type="range" id="cam-vol" min="0" max="100" step="5" value="80"></label>
    </div>
  </div>

  <span id="cam-devs" hidden data-devs='{{devs_json}}'></span>
  <audio id="cam-audio-el" preload="none"></audio>

  <div class="cam-note">
    <b>画面和麦克风默认都是关的</b>——点上面的开关才开始采集，再点一次立刻停。<br>
    画面从电脑摄像头采集后直接推送到手机，<b>电脑屏幕上不会弹出任何窗口</b>。<br>
    没人观看、或离开本页时采集会立即停止（摄像头指示灯也会熄灭）。<br>
    双指可缩放/拖动，双击复位。<br>
    「收音电平」实时显示电脑麦克风的音量（dBFS，0 是满刻度）；旁边
    <b>画面/声音</b>两个读数表示你正在看的画面、正在听的声音是<b>多久以前</b>采到的。
  </div>
  <div class="cam-note cam-err" id="cam-err"></div>
</div>

<script src="/static/cam.js"></script>
</body>
</html>
